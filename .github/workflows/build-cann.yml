name: CI (cann)

# The CANN build is disabled upstream (ggml-org/llama.cpp#23705) and its jobs were
# commented out, which left an empty jobs section and made this workflow file
# invalid. This fork keeps a dispatch-only no-op so the file stays valid and no
# CANN runners are needed.
on:
  workflow_dispatch:

jobs:
  disabled:
    runs-on: ubuntu-24.04
    steps:
      - name: Explain
        run: echo "CANN build is disabled upstream; see ggml-org/llama.cpp#23705."
